[project]
name = "agentic-chatbot"
version = "0.1.0"
description = "Production-ready chatbot backend with AWS Strands, FastAPI, and ag-ui protocol"
requires-python = ">=3.10"
dependencies = [
    # Core
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",

    # AWS
    "boto3>=1.36.0",
    "botocore>=1.36.0",

    # Agents
    "strands-agents>=0.1.0",
    "strands-agents-tools>=0.1.0",

    # AG-UI Protocol
    "ag-ui-protocol>=0.1.0",

    # MCP
    "mcp>=0.9.0",

    # Async HTTP
    "httpx>=0.28.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",

    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
